# CI-конвейер для проекта DataConverter
# Запускается при каждом push и при каждом pull request
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    # Матрица операционных систем: конвейер выполняется параллельно
    # на трёх раннерах. Исходный код, набор тестов и стандарт C++17
    # (задан в CMakeLists.txt) на всех платформах одинаковы.
    strategy:
      # Итог экспериментов (Часть 4): false, чтобы падение на одной ОС
      # не отменяло остальные задания матрицы и не скрывало их результаты.
      # Сравнение: fail-fast: true — первый упавший job отменяет остальные.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Путь к собранному приложению зависит от генератора CMake:
        # Makefiles (Linux/macOS) кладут бинарник в build/,
        # Visual Studio (Windows) — в build/Release/.
        include:
          - os: ubuntu-latest
            binary: build/dataconv
          - os: macos-latest
            binary: build/dataconv
          - os: windows-latest
            binary: build/Release/dataconv.exe

    steps:
      # 1. Получение исходного кода репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Кэширование зависимостей сборки.
      #    build/_deps — каталог FetchContent: скачанные исходники
      #    yaml-cpp 0.9.0 и GoogleTest 1.14.0 + результаты их компиляции.
      #    Ключ кэша включает runner.os (артефакты сборки несовместимы
      #    между ОС) и хэш CMakeLists.txt — в нём зафиксированы версии
      #    зависимостей, поэтому при их обновлении ключ меняется
      #    и кэш пересобирается заново.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt') }}
          # При промахе по полному ключу берём самый свежий кэш этой ОС
          restore-keys: |
            ${{ runner.os }}-deps-

      # 3. Настройка среды сборки.
      #    Компилятор и CMake уже установлены на раннере — проверяем версии.
      #    Внешние зависимости (yaml-cpp 0.9.0, GoogleTest 1.14.0) устанавливаются
      #    на шаге конфигурирования: CMake FetchContent скачивает их из GitHub
      #    по URL, указанным в CMakeLists.txt (или берёт из кэша шага выше).
      - name: Setup build environment
        run: cmake --version

      # 4. Конфигурирование проекта.
      #    CMAKE_BUILD_TYPE применяется генераторами с одной конфигурацией
      #    (Makefiles на Linux/macOS). На Windows генератор Visual Studio —
      #    многоконфигурационный, конфигурация выбирается при сборке (--config).
      - name: Configure (CMake)
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      # 5. Сборка приложения и тестов.
      #    --config Release важен на Windows; на Linux/macOS флаг игнорируется.
      #    --parallel задействует все ядра раннера.
      - name: Build
        run: cmake --build build --config Release --parallel

      # 6. Запуск автоматических тестов (ctest поверх GoogleTest).
      #    --output-log сохраняет полный журнал результатов в файл,
      #    из которого шаг 7 делает артефакт. Ненулевой код возврата
      #    ctest завершает шаг (и весь job) с ошибкой.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --output-log ctest_report.txt

      # 7. Сохранение артефактов (Часть 6).
      #    Отчёт о тестировании грузим ВСЕГДА (if: always()) — в том числе
      #    при провале тестов, чтобы можно было изучить лог без открытия job.
      #    Имена артефактов обязаны быть уникальными в пределах запуска,
      #    поэтому добавляем matrix.os.
      - name: Upload test report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: ctest_report.txt

      # 8. Сохранение собранного приложения (дополнительно).
      #    Путь берётся из matrix.include и зависит от ОС.
      - name: Upload application binary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dataconv-${{ matrix.os }}
          path: ${{ matrix.binary }}
